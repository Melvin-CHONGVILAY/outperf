<meta name="apple-mobile-web-app-title" content="Outperf">
<meta name="format-detection" content="telephone=no">
<script>
try {
  var st = (JSON.parse(localStorage.getItem('outperf.v1') || '{}').settings) || {};
  var th = st.theme || 'auto';
  var dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) {
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151A25');
  }
} catch (e) {}
</script>

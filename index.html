<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outperf</title>
<meta name="description" content="Suis tes heures de travail, lance un chrono et bats ton toi d'hier.">
<meta name="theme-color" content="#0B0F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outperf">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
  --bg:#EDF0F5;--panel:#FFFFFF;--panel-2:#F1F3F7;--line:#DDE2EA;--line-2:#C7CEDA;
  --ink:#0E1420;--ink-2:#414A5C;--muted:#677084;
  --accent:#F5A300;--on-accent:#1C1300;--tint:#9C5E00;--accent-wash:rgba(245,163,0,.14);
  --good:#16A34A;--bad:#DC2626;--good-ink:#15803D;--bad-ink:#B91C1C;
  --ghost:#8C95A8;--ghost-wash:rgba(140,149,168,.16);
  --gS:#6D5BD0;--gA:#16A34A;--gB:#65A30D;--gC:#D97706;--gD:#DC2626;--gX:#8C95A8;
  --c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#eda100;--c4:#e87ba4;--c5:#008300;--c6:#4a3aa7;--c7:#e34948;--c8:#7C8597;
  --h0:#E3E7EE;--h1:#CDEBD8;--h2:#97D8AE;--h3:#56BB7D;--h4:#23974F;--h5:#0E6B33;
  --status-bg:#0B0F17;
  --tabbar:rgba(255,255,255,.86);
  --r-lg:22px;--r-md:16px;--r-sm:11px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F17;--panel:#151A25;--panel-2:#1D2330;--line:#252C3B;--line-2:#333B4E;
    --ink:#F2F4F8;--ink-2:#B3BACA;--muted:#7F899E;
    --accent:#FFB21E;--on-accent:#1C1300;--tint:#FFBE3D;--accent-wash:rgba(255,178,30,.13);
    --good:#2BC46F;--bad:#F0545B;--good-ink:#4ADE80;--bad-ink:#FF8087;
    --ghost:#7F899E;--ghost-wash:rgba(127,137,158,.16);
    --gS:#8B7EF0;--gA:#22B867;--gB:#8DBF2E;--gC:#E8940B;--gD:#E8484F;--gX:#4A5368;
    --c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--c7:#e66767;--c8:#7F899E;
    --h0:#1D2330;--h1:#173A2A;--h2:#1B5838;--h3:#207D4B;--h4:#27A560;--h5:#3DDB83;
    --tabbar:rgba(21,26,37,.84);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F17;--panel:#151A25;--panel-2:#1D2330;--line:#252C3B;--line-2:#333B4E;
  --ink:#F2F4F8;--ink-2:#B3BACA;--muted:#7F899E;
  --accent:#FFB21E;--on-accent:#1C1300;--tint:#FFBE3D;--accent-wash:rgba(255,178,30,.13);
  --good:#2BC46F;--bad:#F0545B;--good-ink:#4ADE80;--bad-ink:#FF8087;
  --ghost:#7F899E;--ghost-wash:rgba(127,137,158,.16);
  --gS:#8B7EF0;--gA:#22B867;--gB:#8DBF2E;--gC:#E8940B;--gD:#E8484F;--gX:#4A5368;
  --c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--c7:#e66767;--c8:#7F899E;
  --h0:#1D2330;--h1:#173A2A;--h2:#1B5838;--h3:#207D4B;--h4:#27A560;--h5:#3DDB83;
  --tabbar:rgba(21,26,37,.84);
}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.38;-webkit-font-smoothing:antialiased;position:fixed;inset:0;width:100%}
.shell{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--num)}
.topsafe{flex:none;height:env(safe-area-inset-top);background:var(--bg)}
.app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.app-in{max-width:560px;margin:0 auto;padding:14px 16px 28px}
.view{display:flex;flex-direction:column;gap:22px}

/* ---------- headings */
.page-title{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:20px;font-weight:650;letter-spacing:-.01em}
.sec-h p,.sec-sub{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- today top */
.today-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{font-size:15px;color:var(--ink-2);font-weight:500}
.hero{font-family:var(--num);font-size:60px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.hero-sub{font-size:15px;color:var(--ink-2);margin-top:4px}
.goalbar{height:8px;border-radius:8px;background:var(--panel-2);overflow:hidden;margin-top:12px;position:relative}
.goalbar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--accent);transition:width .4s ease}
.goalbar.done i{background:var(--good)}
.grade-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.grade{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:32px;color:#fff;background:var(--gX)}
.grade.big{width:84px;height:84px;border-radius:24px;font-size:48px}
.grade.g-S{background:var(--gS)}.grade.g-A{background:var(--gA)}.grade.g-B{background:var(--gB);color:#0E1420}.grade.g-C{background:var(--gC);color:#1C1300}.grade.g-D{background:var(--gD)}
.grade-cap{font-size:11px;color:var(--muted)}

/* ---------- face-off */
.faceoff{display:flex;flex-direction:column;gap:14px;padding:18px 16px}
.faceoff h2{font-size:20px;font-weight:650;letter-spacing:-.01em}
.fo-group{display:flex;flex-direction:column;gap:8px}
.fo-group+.fo-group{border-top:1px solid var(--line);padding-top:14px}
.fo-title{font-size:13px;color:var(--muted);font-weight:500}
.fo-row{display:grid;grid-template-columns:88px 1fr 70px;align-items:center;gap:10px}
.fo-l{font-size:14px;color:var(--ink-2)}
.fo-v{font-family:var(--num);font-size:15px;font-weight:650;text-align:right;white-space:nowrap}
.fo-track{position:relative;height:22px}
.fo-bar{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .4s ease;min-width:2px}
.you .fo-bar{background:var(--accent)}
.you.done .fo-bar{background:var(--good)}
.ghost .fo-bar{background:var(--ghost-wash);box-shadow:inset 0 0 0 1.5px var(--ghost)}
.ghost .fo-v{color:var(--ink-2);font-weight:550}
.fo-goal{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--muted)}
.fo-sm .fo-track{height:12px}
.fo-sm .fo-bar{border-radius:4px}
.verdict{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.verdict .ico{flex:none;width:20px;text-align:center}
.v-good{color:var(--good-ink)}.v-bad{color:var(--bad-ink)}.v-neutral{color:var(--ink-2)}
.streak{display:flex;align-items:center;gap:12px;background:var(--accent-wash);border-radius:var(--r-md);padding:12px 14px}
.streak b{font-family:var(--num);font-size:28px;line-height:1;font-weight:800;color:var(--tint)}
.streak p{font-size:14px;color:var(--ink-2)}
.streak strong{color:var(--ink);font-weight:650}

/* ---------- lists */
.list{background:var(--panel);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;min-height:60px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bar-key{width:4px;align-self:stretch;border-radius:4px;flex:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-t{font-size:16px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted)}
.row-s.live{color:var(--tint);font-weight:600}
.row-v{font-family:var(--num);font-weight:650;font-size:16px;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);flex:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.primary{background:var(--accent);color:var(--on-accent)}
.icon-btn.ghost{background:transparent;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:15px;font-weight:650;font-size:17px;background:var(--panel-2);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:transparent;color:var(--bad-ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:15px;border-radius:12px}
.btn:active,.icon-btn:active,.chip:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--panel);border:1px solid var(--line);font-size:15px;font-weight:550;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:10px;height:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.input{height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);padding:0 14px;font-size:17px;width:100%;-webkit-appearance:none;appearance:none}
textarea.input{height:150px;padding:12px 14px;font-size:15px;line-height:1.4;resize:vertical}
.dur-in{display:flex;align-items:center;gap:8px}
.dur-in .input{width:84px;text-align:center;font-family:var(--num);font-size:22px;font-weight:650}
.dur-in span{color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .val{min-width:84px;text-align:center;font-family:var(--num);font-size:20px;font-weight:700}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:16px;background:var(--line-2);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked+i{background:var(--good)}
.toggle input:checked+i::after{transform:translateX(20px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;position:relative}
.swatch.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2.5px var(--ink)}

/* ---------- tabbar */
.tabbar{flex:none;position:relative;z-index:40;background:var(--panel);background:var(--tabbar);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 4px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--tint)}
.tab .pulse{position:absolute;top:2px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}

/* ---------- running banner */
.runbar{position:sticky;top:6px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;margin-bottom:14px;width:100%;text-align:left}
.runbar .dot{box-shadow:0 0 0 2px var(--ink)}
.runbar .rb-t{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar .rb-c{font-family:var(--num);font-size:17px;font-weight:700}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- chrono */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--panel-2)}
.ring .prg{stroke:var(--accent);transition:stroke-dashoffset .5s linear}
.ring.done .prg{stroke:var(--good)}
.ring.brk .prg{stroke:var(--ghost)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 14%}
.clock{font-family:var(--num);font-size:clamp(46px,14vw,62px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.clock.paused{color:var(--muted)}
.ring-l{font-size:14px;color:var(--ink-2);font-weight:550}
.ring-s{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:54px}
.opt+.opt{border-top:1px solid var(--line)}
.opt-t{font-size:16px}
.opt-s{font-size:13px;color:var(--muted)}

/* ---------- stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px 12px;display:flex;flex-direction:column;gap:3px;min-height:104px}
.kpi-l{font-size:13px;color:var(--muted);font-weight:500}
.kpi-v{font-family:var(--num);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi-d{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:auto}
.kpi-d.up{color:var(--good-ink)}.kpi-d.down{color:var(--bad-ink)}
.verdicts{display:flex;flex-direction:column;gap:10px}
.gradehead{display:flex;gap:16px;align-items:center}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 12px 10px}
.chart-card .sec-h{padding:0 4px 10px;flex-direction:column;align-items:flex-start;gap:2px}
.chart-card .sec-h h2{font-size:17px}
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .tick{fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-weight:650}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-width:1.25;stroke-dasharray:4 4}
.chart .hit{fill:transparent}
.chart .mk{transition:opacity .15s}
.chart .hl{opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 4px 2px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.ln{width:14px;height:0;border-radius:0;border-top:2px solid}
.legend i.dash{width:14px;height:0;border-radius:0;border-top:1.5px dashed var(--muted)}
.legend i.gh{background:var(--ghost-wash);box-shadow:inset 0 0 0 1.5px var(--ghost)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:0 4px 8px}
.ctable th:first-child{text-align:left}
.ctable td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable td:first-child{text-align:left;white-space:normal}
.ctable .cn{display:flex;align-items:center;gap:8px;font-weight:550}
.ctable .up{color:var(--good-ink)}.ctable .down{color:var(--bad-ink)}
.ctable tr.tot td{font-weight:700;border-top:1.5px solid var(--line-2)}
.mini{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:5px;width:100%}
.mini i{display:block;height:100%;border-radius:6px}
.tag{font-size:11px;color:var(--muted);font-weight:500}

/* ---------- journal */
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.day-h{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.day-h .grade{width:34px;height:34px;border-radius:10px;font-size:18px}
.day-main{flex:1;min-width:0}
.day-t{font-size:15px;font-weight:600}
.stack{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-top:6px;gap:2px;background:var(--panel-2)}
.stack i{display:block;height:100%}
.day-v{font-family:var(--num);font-weight:700;font-size:17px;text-align:right}
.day-v small{display:block;font-family:var(--font);font-size:12px;font-weight:600}
.day-body{border-top:1px solid var(--line)}
.ent{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;font-size:15px}
.ent+.ent{border-top:1px solid var(--line)}
.ent-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:42px;flex:none}
.ent-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-n small{color:var(--muted);font-size:12.5px}
.ent-v{font-family:var(--num);font-weight:650}
.month-h{font-size:13px;color:var(--muted);font-weight:600;margin:6px 4px -10px}

/* ---------- sheet, toast, tooltip */
.backdrop{position:fixed;inset:0;background:rgba(5,8,14,.5);z-index:70;opacity:0;transition:opacity .22s}
.backdrop.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--panel);border-radius:24px 24px 0 0;max-height:92dvh;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.in{transform:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}

function niceScale(maxV) {

}

    g.append(sv('text', { x: box.x0 - 7, y: y + 4, 'text-anchor': 'end', class: 'tick' }, fmtTick ? fmtTick(v) : fmtNum(v, Math.abs(step - Math.round(step)) > 1e-9 ? 1 : 0)));

async function shareText(name, mime, text) {

  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  } catch (e) { toast('Export impossible ici'); return false; }
}

      m = Math.round(m / 5) * 5;
      if (m >= 10) S.entries.push({ id: uid(), d: k, c: c.id, m, src: rnd() < 0.5 ? 'timer' : 'manual', t: fromKey(k).getTime(), s: fromKey(k).getTime() - 3 * 3600000 + j * 3600000 });
